<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speedometer Bucin</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="hud engine-off" id="hud">

        <div class="warning" id="warning">PASANG SEATBEALT SAYANG!</div>

        <section class="cluster">
            <div class="halo"></div>
            <div class="bezel"></div>
            <div class="face"></div>

            <svg class="dial" viewBox="0 0 340 340" aria-hidden="true">
                <circle class="hair" cx="170" cy="170" r="160"/>

                <circle id="rpmTrack" class="arc-track" cx="170" cy="170" r="150"/>
                <circle id="rpmRed" class="arc-red" cx="170" cy="170" r="150"/>
                <circle id="rpmArc" class="arc-rpm" cx="170" cy="170" r="150"/>
                <g id="ticks"></g>

                <circle id="healthTrack" class="side-track" cx="170" cy="170" r="100"/>
                <circle id="healthArc" class="side-arc" cx="170" cy="170" r="100"/>
                <g transform="translate(340 0) scale(-1 1)">
                    <circle id="fuelTrack" class="side-track" cx="170" cy="170" r="100"/>
                    <circle id="fuelArc" class="side-arc" cx="170" cy="170" r="100"/>
                </g>

                <g id="healthInfo" class="info">
                    <path d="M0 6 C-9 -1 -7 -8 0 -3 C7 -8 9 -1 0 6Z" transform="translate(80 229)"/>
                    <text id="health" x="92" y="233">100</text>
                </g>
                <g id="fuelInfo" class="info right">
                    <path d="M0 -7 C5 -1 6 2 6 4 A6 6 0 0 1 -6 4 C-6 2 -5 -1 0 -7Z" transform="translate(260 229)"/>
                    <text id="fuel" x="248" y="233">100</text>
                </g>

                <g id="pointer">
                    <polygon points="298,168.4 330,166.6 330,173.4 298,171.6"/>
                </g>
            </svg>

            <div class="medallion">
                <div class="medallion-inner">
                    <svg viewBox="0 0 80 80" aria-hidden="true">
                        <defs>
                            <linearGradient id="spdGrad" x1="0" y1="0" x2="1" y2="1">
                                <stop offset="0" stop-color="#2ea8ff"/>
                                <stop offset="1" stop-color="#8b5cff"/>
                            </linearGradient>
                        </defs>
                        <circle class="m-track" cx="40" cy="40" r="37"/>
                        <circle id="spdArc" class="m-arc" cx="40" cy="40" r="37" transform="rotate(-90 40 40)"/>
                    </svg>
                    <img src="photo.jpg" alt="">
                </div>
            </div>

            <div class="indicators" id="indicators">
                <svg class="arrow left" id="indLeft" viewBox="0 0 26 24"><polygon points="12,3 2,12 12,21 15.5,21 6,12 15.5,3"/><polygon points="22,3 12,12 22,21 25.5,21 16,12 25.5,3"/></svg>
                <svg class="arrow right" id="indRight" viewBox="0 0 26 24"><polygon points="12,3 2,12 12,21 15.5,21 6,12 15.5,3"/><polygon points="22,3 12,12 22,21 25.5,21 16,12 25.5,3"/></svg>
            </div>

            <div class="speed-wrap">
                <span class="speed" id="speed">0</span>
                <span class="unit" id="speedUnit">mph</span>
            </div>

            <div class="gear-badge">
                <span class="gear-label">Gear</span>
                <span class="gear" id="gear">N</span>
            </div>

            <div class="plate">
                <!-- Engine -->
                <span class="ico" id="engine">
                    <svg viewBox="0 0 24 24"><path d="M5 9h2V7h3V5h4v2h2l2 2h2v7h-2l-2 2H9l-4-4z"/><path d="M2.5 10.5v4"/></svg>
                </span>
                <!-- Lampu depan: low beam / high beam -->
                <span class="ico" id="headlights">
                    <svg viewBox="0 0 24 24">
                        <path d="M11 6c5.5 0 9 2.5 9 6s-3.5 6-9 6c-2.2 0-3.5-3-3.5-6s1.3-6 3.5-6z"/>
                        <g class="beam-low"><path d="M2.5 9.5l3.5 1.3M2.5 13l3.5 1.3M2.5 16.5l3.5 1.3"/></g>
                        <g class="beam-high"><path d="M2.5 9h3.5M2.5 12h3.5M2.5 15h3.5"/></g>
                    </svg>
                </span>
                <!-- Seatbelt -->
                <span class="ico" id="seatbelts">
                    <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><path d="M8 21l1.2-8.5C9.5 10.5 10.5 9.5 12 9.5s2.5 1 2.8 3L16 21"/><path d="M9.2 10.5l6.3 7"/></svg>
                </span>
                <!-- Kunci kendaraan -->
                <span class="ico" id="lock">
                    <svg viewBox="0 0 24 24">
                        <rect x="6" y="11" width="12" height="9" rx="2"/>
                        <path class="lock-closed" d="M8.5 11V8a3.5 3.5 0 0 1 7 0v3"/>
                        <path class="lock-open" d="M8.5 11V8a3.5 3.5 0 0 1 6.6-1.6"/>
                        <circle cx="12" cy="15.5" r="1" class="keyhole"/>
                    </svg>
                </span>
                <span class="sep"></span>
                <span class="odo" id="odometer">0.0 mi</span>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
